[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

build_src_filter =
    +<*>
    -<simulation/>

lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306


[env:simulation]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

build_src_filter =
    +<simulation/main.cpp>

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306